<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Examatro tests</title>
<style>body{font:15px monospace;background:#0b1412;color:#f6efdc;padding:16px}.ok{color:#5fd38d}.bad{color:#ff6b61}</style></head>
<body><h3>Poker evaluator tests</h3><pre id="o"></pre>
<script src="js/poker.js"></script>
<script>
// "AS" = Ace of spades. Suit: S H C D
const P = s => s.split(' ').map(t => { const v = t.slice(0, -1), r = {J:11,Q:12,K:13,A:14}[v] || +v; return { r, s: 'SHCD'.indexOf(t.slice(-1)) }; });
const T = [
  ['High Card','2S 5H 9C JD KS','High Card'],
  ['Pair','2S 2H 9C JD KS','Pair'],
  ['Two Pair','2S 2H 9C 9D KS','Two Pair'],
  ['Three of a Kind','2S 2H 2C 9D KS','Three of a Kind'],
  ['Straight','5S 6H 7C 8D 9S','Straight'],
  ['Straight (Ace low)','AS 2H 3C 4D 5S','Straight'],
  ['Straight (Ace high)','10S JH QC KD AS','Straight'],
  ['No wraparound (Q K A 2 3)','QS KH AC 2D 3S','High Card'],
  ['Flush','2S 5S 9S JS KS','Flush'],
  ['Full House','3S 3H 3C 8D 8S','Full House'],
  ['Four of a Kind','7S 7H 7C 7D 2S','Four of a Kind'],
  ['Straight Flush','5H 6H 7H 8H 9H','Straight Flush'],
  ['Straight Flush (Ace low)','AH 2H 3H 4H 5H','Straight Flush'],
  ['Royal Flush','10S JS QS KS AS','Royal Flush'],
  ['4 kartu: Four of a Kind','9S 9H 9C 9D','Four of a Kind'],
  ['4 kartu: tidak bisa Flush/Straight','2S 3S 4S 5S','High Card'],
  ['Rank+suit sama (duplikat) = Pair','9S 9S 2H','Pair'],
  ['6 kartu: pilih Full House terbaik','3S 3H 3C 8D 8S KS','Full House'],
  ['6 kartu: Straight tersembunyi','2S 6H 7C 8D 9S 10H','Straight']
];
let fail = 0, out = '';
for (const [n, h, exp] of T) {
  const got = evalBest(P(h)).name, ok = got === exp; if (!ok) fail++;
  out += `<span class="${ok ? 'ok' : 'bad'}">${ok ? 'PASS' : 'FAIL'}</span> ${n}: ${got}${ok ? '' : ' (harusnya ' + exp + ')'}\n`;
}
// Scoring cards: Pair hanya 2 kartu, Two Pair 4 kartu
const sc1 = evalBest(P('2S 2H 9C JD KS')).sc.length, sc2 = evalBest(P('2S 2H 9C 9D KS')).sc.length;
const okSc = sc1 === 2 && sc2 === 4; if (!okSc) fail++;
out += `<span class="${okSc ? 'ok' : 'bad'}">${okSc ? 'PASS' : 'FAIL'}</span> Scoring cards Pair=2, Two Pair=4\n`;
out += `\n${fail ? fail + ' GAGAL' : 'Semua tes lulus'}`;
document.getElementById('o').innerHTML = out;
</script></body></html>
